name: Secret scan

# Local pre-commit hooks (.pre-commit-config.yaml) can be skipped with
# `--no-verify` or simply never installed, so this workflow re-runs gitleaks
# server-side over the *entire* history reachable from the scanned ref. It is
# the enforcing copy; the hook is the fast-feedback copy.
#
# This installs a pinned, checksum-verified gitleaks release binary rather than
# gitleaks/gitleaks-action, because that action requires a paid GITLEAKS_LICENSE
# for repositories owned by an organisation.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Re-scan weekly so a rule update catches something the original scan missed.
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # gitleaks scans commit diffs, so a shallow clone would silently skip
          # everything but the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-connrefused \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}" gitleaks
          gitleaks version

      - name: Assert history is complete
        run: |
          set -euo pipefail
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            echo "error: repository is shallow; gitleaks would skip history" >&2
            exit 1
          fi
          echo "commits reachable: $(git rev-list --count HEAD)"

      - name: Scan full history
        run: |
          set -euo pipefail
          gitleaks git . \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Scan working tree
        run: |
          set -euo pipefail
          gitleaks dir . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-tree.json \
            --exit-code 1

      - name: Upload scan reports
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-reports-${{ github.run_id }}
          path: |
            gitleaks.sarif
            gitleaks-tree.json
          if-no-files-found: ignore
          retention-days: 7
